packages:
  - packages/*
  - stackd
  - bridge
  - doctor
  - cli
  - dashboard
  - fake-model
  - exo-sim
  - data/generator
  - evals/runner
  - harnesses/*
  - tools

# better-sqlite3 ships prebuilt binaries (darwin/linux, arm64/x64); building it from source would
# need a compiler that the slim Docker images do not have, so its build script is not run.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - better-sqlite3
